[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-map-lite"
version = "0.1.0"
description = "Toy claim-evidence graph schemas for public-safe research evidence maps."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "SHawn"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
